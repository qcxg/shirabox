name: shirabox
description: A powerful ADB toolbox built with Flutter.
publish_to: 'none'
version: 0.9.0+1

environment:
  # 这里的版本限制确保了你能够使用 Dart 3 的新语法 (switch expression, patterns 等)
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  archive: ^4.0.7
  path: ^1.8.3
  desktop_drop: ^0.7.0
  shared_preferences: ^2.2.0
  file_picker: ^10.3.8
  flutter_acrylic: ^1.1.4
  device_info_plus: ^12.3.0
  window_manager: ^0.5.1
  flutter_localizations: # 新增
    sdk: flutter
  intl: ^0.20.2 # 新增
  package_info_plus: ^9.0.0
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/server.jar
